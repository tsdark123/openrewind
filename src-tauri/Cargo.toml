[package]
name = "openrewind"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openrewind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "openrewind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "fs", "io-util"] }
reqwest = { version = "0.13", features = ["stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
sysinfo = "0.31"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
